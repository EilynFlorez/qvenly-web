<div class="page">
  <app-topbar
    title="Nuevo Plan"
    subtitle="Completa la información para crear un plan de servicio">
  </app-topbar>

  <div class="page-content">
    <app-plan-form
      submitLabel="Crear plan"
      [isSubmitting]="isSubmitting"
      [errorMessage]="errorMessage"
      (formSubmit)="onSubmit($event)"
      (formCancel)="cancel()">
    </app-plan-form>
  </div>
</div>

<app-success-modal
  *ngIf="successMessage"
  title="¡Plan creado exitosamente!"
  [message]="successMessage"
  (accepted)="acceptSuccess()">
</app-success-modal>
