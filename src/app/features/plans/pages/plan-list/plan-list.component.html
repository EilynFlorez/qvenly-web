<div class="page">

    <!-- Topbar -->
    <app-topbar title="Gestión de Planes" subtitle="Administra los planes de servicio del sistema"
        [showExport]="false"></app-topbar>

    <div class="page-content">

        <!-- Header de acciones -->
        <div class="page-header">
            <button class="btn btn-outline" (click)="showFilters = !showFilters">
                <i class="ti ti-filter"></i>
                {{ showFilters ? 'Ocultar filtros' : 'Filtrar' }}
            </button>
            <a routerLink="/plans/create" class="btn btn-primary">
                <i class="ti ti-plus"></i>
                Nuevo plan
            </a>
        </div>

        <!-- Filtros -->
        <div class="filters-card" *ngIf="showFilters">
            <h3 class="filters-title">
                <i class="ti ti-search"></i>
                Buscar y filtrar planes
            </h3>
            <form [formGroup]="filterForm" class="filters-grid">
                <div class="filter-field">
                    <label>Nombre</label>
                    <input type="text" formControlName="name" placeholder="Nombre del plan..." />
                </div>
                <div class="filter-field">
                    <label>Estado</label>
                    <select formControlName="status">
                        <option value="">Todos</option>
                        <option value="active">Activo</option>
                        <option value="inactive">Inactivo</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label>Precio mínimo</label>
                    <input type="number" formControlName="minPrice" placeholder="$0" />
                </div>
                <div class="filter-field">
                    <label>Precio máximo</label>
                    <input type="number" formControlName="maxPrice" placeholder="$999.999" />
                </div>
            </form>
            <div class="filters-actions">
                <button class="btn btn-outline" (click)="clearFilters()">
                    <i class="ti ti-x"></i>
                    Limpiar
                </button>
                <button class="btn btn-primary" (click)="applyFilters()">
                    <i class="ti ti-search"></i>
                    Buscar
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div class="state-box" *ngIf="isLoading">
            <div class="spinner"></div>
            <p>Cargando planes...</p>
        </div>

        <!-- Error -->
        <div class="state-box state-box--error" *ngIf="!isLoading && errorMessage">
            <i class="ti ti-alert-circle"></i>
            <p>{{ errorMessage }}</p>
            <button class="btn btn-outline" (click)="loadPlans()">
                <i class="ti ti-refresh"></i>
                Reintentar
            </button>
        </div>

        <!-- Sin planes -->
        <div class="state-box" *ngIf="!isLoading && !errorMessage && plans.length === 0">
            <i class="ti ti-mood-empty"></i>
            <p>No hay planes registrados.</p>
            <a routerLink="/plans/create" class="btn btn-primary">
                <i class="ti ti-plus"></i>
                Crear primer plan
            </a>
        </div>

        <!-- Lista de planes -->
        <div class="plans-grid" *ngIf="!isLoading && !errorMessage && plans.length > 0">
            <app-plan-card *ngFor="let plan of plans" [plan]="plan" (view)="viewPlan($event)" (edit)="editPlan($event)"
                (delete)="openDeleteModal($event)">
            </app-plan-card>
        </div>

    </div>
</div>



<!-- Modal de eliminación -->
<app-delete-modal *ngIf="planToDelete" [plan]="planToDelete" [isDeleting]="isDeleting" (cancelled)="closeDeleteModal()"
    (confirmed)="confirmDelete($event)">
</app-delete-modal>

<!-- Modal de éxito -->
<app-success-modal *ngIf="successMessage" title="¡Eliminado exitosamente!" [message]="successMessage"
    (accepted)="successMessage = ''">
</app-success-modal>
