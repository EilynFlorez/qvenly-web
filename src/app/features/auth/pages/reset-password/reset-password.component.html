<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="assets/images/logoQvenly.png" alt="Qvenly logo">
      <span>Qvenly</span>
    </div>

    <!-- Título -->
    <h2 class="auth-title">Restablecer contraseña</h2>
    <p class="auth-subtitle">Ingresa tu nueva contraseña para continuar.</p>

    <!-- Alerta error -->
    <div *ngIf="errorMessage" class="alert alert--error">
      <i class="ti ti-alert-circle"></i>
      {{ errorMessage }}
    </div>

    <!-- Alerta éxito -->
    <div *ngIf="successMessage" class="alert alert--success">
      <i class="ti ti-circle-check"></i>
      {{ successMessage }} Redirigiendo al login...
    </div>

    <!-- Formulario -->
    <div class="auth-form">

      <!-- Nueva contraseña -->
      <div class="form-field">
        <label class="form-label">
          Nueva contraseña
          <span class="form-label__hint">(mín. 8 caracteres, 1 mayúscula, 1 número y 1 carácter especial)</span>
        </label>
        <div class="input-password">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            placeholder="••••••••"
            [(ngModel)]="newPassword"
            name="newPassword"
            (blur)="touch('newPassword')"
            (ngModelChange)="touch('confirmPassword')"
            class="form-input"
            [class.form-input--error]="fieldState('newPassword') === 'error'"
            [class.form-input--success]="fieldState('newPassword') === 'success'"
          />
          <button type="button" class="input-password__toggle" (click)="showNewPassword = !showNewPassword">
            <i [class]="showNewPassword ? 'ti ti-eye-off' : 'ti ti-eye'"></i>
          </button>
        </div>

        <!-- Barra de fortaleza -->
        <div *ngIf="touched['newPassword'] && newPassword" class="password-strength">
          <div class="password-strength__bars">
            <span class="bar" [class.active]="true" [class.weak]="passwordStrength.level === 'weak'" [class.medium]="passwordStrength.level === 'medium'" [class.strong]="passwordStrength.level === 'strong'"></span>
            <span class="bar" [class.active]="passwordStrength.level === 'medium' || passwordStrength.level === 'strong'" [class.medium]="passwordStrength.level === 'medium'" [class.strong]="passwordStrength.level === 'strong'"></span>
            <span class="bar" [class.active]="passwordStrength.level === 'strong'" [class.strong]="passwordStrength.level === 'strong'"></span>
          </div>
          <span class="password-strength__label" [class]="'label--' + passwordStrength.level">
            {{ passwordStrength.label }}
          </span>
        </div>

        <span *ngIf="getNewPasswordError()" class="form-error">
          <i class="ti ti-alert-circle"></i>
          {{ getNewPasswordError() }}
        </span>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-field">
        <label class="form-label">Confirmar contraseña</label>
        <div class="input-password">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="••••••••"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            (blur)="touch('confirmPassword')"
            class="form-input"
            [class.form-input--error]="fieldState('confirmPassword') === 'error'"
            [class.form-input--success]="fieldState('confirmPassword') === 'success'"
          />
          <button type="button" class="input-password__toggle" (click)="showConfirmPassword = !showConfirmPassword">
            <i [class]="showConfirmPassword ? 'ti ti-eye-off' : 'ti ti-eye'"></i>
          </button>
        </div>
        <span *ngIf="getConfirmPasswordError()" class="form-error">
          <i class="ti ti-alert-circle"></i>
          {{ getConfirmPasswordError() }}
        </span>
        <span *ngIf="touched['confirmPassword'] && !getConfirmPasswordError() && confirmPassword" class="form-success">
          <i class="ti ti-circle-check"></i>
          Las contraseñas coinciden
        </span>
      </div>

      <button
        class="btn-primary"
        (click)="onSubmit()"
        [disabled]="isLoading || !token"
      >
        {{ isLoading ? 'Restableciendo...' : 'Restablecer contraseña' }}
      </button>

    </div>

    <p class="auth-footer-text">
      <a routerLink="/auth/login" class="auth-link">Volver a Iniciar Sesión</a>
    </p>

  </div>
</div>
