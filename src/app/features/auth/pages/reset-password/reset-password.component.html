<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="assets/images/logoQvenly.png" alt="Qvenly logo">
      <span>Qvenly</span>
    </div>

    <!-- Título -->
    <h2 class="auth-title">Restablecer contraseña</h2>
    <p class="auth-subtitle">Ingresa tu nueva contraseña para continuar.</p>

    <!-- Alerta error -->
    <div *ngIf="errorMessage" class="alert alert--error">
      {{ errorMessage }}
    </div>

    <!-- Alerta éxito -->
    <div *ngIf="successMessage" class="alert alert--success">
      {{ successMessage }} Redirigiendo al login...
    </div>

    <!-- Formulario -->
    <div class="auth-form">

      <div class="form-field">
        <label class="form-label">
          Nueva contraseña
          <span class="form-label__hint">(mín. 8 caracteres, incluir mayúsculas y números)</span>
        </label>
        <input
          type="password"
          placeholder="••••••••"
          [(ngModel)]="newPassword"
          name="newPassword"
          class="form-input"
        />
      </div>

      <div class="form-field">
        <label class="form-label">Confirmar contraseña</label>
        <input
          type="password"
          placeholder="••••••••"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          class="form-input"
        />
      </div>

      <button
        class="btn-primary"
        (click)="onSubmit()"
        [disabled]="isLoading || !token"
      >
        {{ isLoading ? 'Restableciendo...' : 'Restablecer contraseña' }}
      </button>

    </div>

    <p class="auth-footer-text">
      <a routerLink="/auth/login" class="auth-link">Volver a Iniciar Sesión</a>
    </p>

  </div>
</div>
