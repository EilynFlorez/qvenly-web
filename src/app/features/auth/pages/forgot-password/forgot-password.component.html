<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="assets/images/logoQvenly.png" alt="Qvenly logo">
      <span>Qvenly</span>
    </div>

    <!-- Título -->
    <h2 class="auth-title">¿Olvidaste tu contraseña?</h2>
    <p class="auth-subtitle">
      Ingresa tu correo y te enviaremos un enlace para restablecerla.
    </p>

    <!-- Alerta error -->
    <div *ngIf="errorMessage" class="alert alert--error">
      {{ errorMessage }}
    </div>

    <!-- Alerta éxito -->
    <!-- Alerta éxito -->
    <div *ngIf="successMessage" class="alert alert--success">
      <i class="ti ti-mail-check"></i>
      {{ successMessage }}
    </div>

    <!-- Formulario -->
    <div *ngIf="!successMessage" class="auth-form">

      <div class="form-field">
        <label class="form-label">Correo electrónico</label>
        <input type="email" placeholder="tucorreo@ejemplo.com" [(ngModel)]="email" name="email" class="form-input" />
      </div>

      <button class="btn-primary" (click)="onSubmit()" [disabled]="isLoading">
        {{ isLoading ? 'Enviando...' : 'Enviar instrucciones' }}
      </button>

    </div>

    <p class="auth-footer-text">
      <a routerLink="/auth/login" class="auth-link">← Volver a Iniciar Sesión</a>
    </p>

  </div>
</div>
