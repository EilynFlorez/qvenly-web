<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="assets/images/logoQvenly.png" alt="Qvenly logo">
      <span>Qvenly</span>
    </div>

    <!-- Título -->
    <h2 class="auth-title">Iniciar Sesión</h2>
    <p class="auth-subtitle">Accede a tu cuenta para gestionar tus eventos</p>

    <!-- Alerta éxito -->
    <div *ngIf="successMessage" class="alert alert--success">
      <i class="ti ti-circle-check"></i>
      {{ successMessage }}
    </div>

    <!-- Alerta error -->
    <div *ngIf="errorMessage" class="alert alert--error">
      <i class="ti ti-alert-circle"></i>
      {{ errorMessage }}
    </div>

    <!-- Formulario -->
    <div class="auth-form">

      <!-- Email -->
      <div class="form-field">
        <label class="form-label">Correo electrónico</label>
        <input
          type="email"
          placeholder="tucorreo@ejemplo.com"
          [(ngModel)]="loginData.email"
          name="email"
          (blur)="touch('email')"
          class="form-input"
          [class.form-input--error]="getEmailError()"
        />
        <span *ngIf="getEmailError()" class="form-error">
          <i class="ti ti-alert-circle"></i>
          {{ getEmailError() }}
        </span>
      </div>

      <!-- Contraseña -->
      <div class="form-field">
        <label class="form-label">Contraseña</label>
        <div class="input-password">
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            [(ngModel)]="loginData.password"
            name="password"
            (blur)="touch('password')"
            class="form-input"
            [class.form-input--error]="getPasswordError()"
          />
          <button type="button" class="input-password__toggle" (click)="showPassword = !showPassword">
            <i [class]="showPassword ? 'ti ti-eye-off' : 'ti ti-eye'"></i>
          </button>
        </div>
        <span *ngIf="getPasswordError()" class="form-error">
          <i class="ti ti-alert-circle"></i>
          {{ getPasswordError() }}
        </span>
      </div>

      <div class="form-row">
        <label class="form-checkbox">
          <input type="checkbox" [(ngModel)]="loginData.rememberMe" name="rememberMe" />
          Recordarme
        </label>
        <a routerLink="/auth/forgot-password" class="form-link">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <button
        class="btn-primary"
        (click)="onSubmit()"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>

    </div>

    <!-- Divider -->
    <div class="auth-divider">
      <span>o continúa con</span>
    </div>

    <!-- Google -->
    <button class="btn-google" (click)="onGoogleLogin()">
      <svg class="btn-google__icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuar con Google
    </button>

    <!-- Registro -->
    <p class="auth-footer-text">
      ¿No tienes cuenta?
      <a routerLink="/auth/register" class="auth-link">Regístrate</a>
    </p>

  </div>
</div>
