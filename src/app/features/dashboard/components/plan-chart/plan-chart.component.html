<app-skeleton *ngIf="loading" type="chart" [height]="260"></app-skeleton>

<!-- Datos -->
<div *ngIf="!loading && !error" class="chart-card">

  <div class="chart-header">
    <div>
      <h3 class="chart-title">Organizadores por plan</h3>
      <p class="chart-sub">Distribución según tipo de plan</p>
    </div>
    <div class="badge-destacado" *ngIf="featuredPlan">
      <i class="ti ti-star"></i>
      {{ featuredPlan }}
    </div>
  </div>

  <!-- Sin datos sin filtros -->
  <div *ngIf="noData && !hasActiveFilters" class="no-data">
    <i class="ti ti-chart-donut-off"></i>
    <p>No hay datos disponibles para mostrar</p>
  </div>

  <!-- Sin datos con filtros -->
  <div *ngIf="noData && hasActiveFilters" class="no-data">
    <i class="ti ti-filter-off"></i>
    <p>No se encontraron resultados para los filtros seleccionados</p>
  </div>

  <!-- Con datos -->
  <div *ngIf="!noData" class="chart-wrapper">
    <canvas id="planChart"></canvas>
  </div>

</div>
