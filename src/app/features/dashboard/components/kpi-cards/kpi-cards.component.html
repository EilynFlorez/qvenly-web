<app-skeleton *ngIf="loading" type="cards"></app-skeleton>

<!-- Datos -->
<div *ngIf="stats && !loading" class="kpi-grid">

  <div class="kpi-card c-teal">
    <div class="kpi-icon teal">
      <i class="ti ti-users"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalUsers }}</p>
      <p class="kpi-title">Total usuarios</p>
    </div>
  </div>

  <div class="kpi-card c-gold">
    <div class="kpi-icon gold">
      <i class="ti ti-building"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalOrganizers }}</p>
      <p class="kpi-title">Organizadores</p>
    </div>
  </div>

  <div class="kpi-card c-purple">
    <div class="kpi-icon purple">
      <i class="ti ti-id-badge"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalStaff }}</p>
      <p class="kpi-title">Personal</p>
    </div>
  </div>

  <div class="kpi-card c-green">
    <div class="kpi-icon green">
      <i class="ti ti-ticket"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalAssistants }}</p>
      <p class="kpi-title">Asistentes</p>
    </div>
  </div>

  <div class="kpi-card c-orange">
    <div class="kpi-icon orange">
      <i class="ti ti-gavel"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalJudges }}</p>
      <p class="kpi-title">Jurados</p>
    </div>
  </div>

  <div class="kpi-card c-pink">
    <div class="kpi-icon pink">
      <i class="ti ti-trophy"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalParticipants }}</p>
      <p class="kpi-title">Participantes</p>
    </div>
  </div>

  <div class="kpi-card c-blue">
    <div class="kpi-icon blue">
      <i class="ti ti-calendar-event"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalEvents }}</p>
      <p class="kpi-title">Total eventos</p>
    </div>
  </div>

</div>
