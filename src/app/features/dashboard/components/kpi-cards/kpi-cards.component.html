<app-skeleton *ngIf="loading" type="cards"></app-skeleton>

<!-- Datos -->
<div *ngIf="stats && !loading" class="kpi-grid">

  <div class="kpi-card c-teal">
    <div class="kpi-icon teal">
      <i class="ti ti-users"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalUsers || 0 }}</p>
      <p class="kpi-title">Total usuarios</p>
    </div>
  </div>

  <div class="kpi-card c-gold">
    <div class="kpi-icon gold">
      <i class="ti ti-building"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalOrganizers || 0}}</p>
      <p class="kpi-title">Organizadores</p>
    </div>
  </div>

  <div class="kpi-card c-purple">
    <div class="kpi-icon purple">
      <i class="ti ti-id-badge"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalStaff || 0}}</p>
      <p class="kpi-title">Personal</p>
    </div>
  </div>

  <div class="kpi-card c-green">
    <div class="kpi-icon green">
      <i class="ti ti-users"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalGuests || 0}}</p>
      <p class="kpi-title">Invitados</p>
    </div>
  </div>

  <div class="kpi-card c-blue">
    <div class="kpi-icon blue">
      <i class="ti ti-calendar-event"></i>
    </div>
    <div class="kpi-text">
      <p class="kpi-value">{{ stats.totalEvents || 0}}</p>
      <p class="kpi-title">Total eventos</p>
    </div>
  </div>

</div>
