<app-skeleton *ngIf="loading" type="chart" [height]="280"></app-skeleton>

<div class="chart-card" *ngIf="!loading && !error">

    <div class="chart-header">
       <div>
        <h3 class="chart-title">Crecimiento mensual de usuarios</h3>
        <p class="chart-sub">Nuevos usuarios registrados mes a mes</p>
       </div>
       <div class="badge-peak" *ngIf="peakMonth">
        <i class="ti ti-trending-up"></i>
        mes pico: {{peakMonth}}
       </div>
    </div>

    <div class="chart-wrapper">
        <canvas id="monthlyChart"></canvas>
    </div>
</div>
