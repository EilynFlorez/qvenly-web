<app-skeleton *ngIf="loading" type="table"></app-skeleton>

<!-- Tabla -->
<div *ngIf="!loading && !error" class="table-card">

  <div class="table-header">
    <div>
      <h3 class="table-title">Usuarios por evento</h3>
      <p class="table-sub">Cantidad de usuarios por rol en cada evento</p>
    </div>
  </div>

  <!-- Sin datos -->
  <div *ngIf="noData" class="no-data">
    <i class="ti ti-table-off"></i>
    <p>No hay eventos registrados aún</p>
  </div>

  <!-- Con datos -->
  <div *ngIf="!noData" class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Evento</th>
          <th>
            <span class="th-badge personal">
              <i class="ti ti-id-badge"></i>
              Personal
            </span>
          </th>
          <th>
            <span class="th-badge invitados">
              <i class="ti ti-users"></i>
              Invitados
            </span>
          </th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let event of events">
          <td class="event-name">
            <i class="ti ti-calendar-event"></i>
            {{ event.eventName }}
          </td>
          <td><span class="badge personal">{{ event.staff }}</span></td>
          <td><span class="badge invitados">{{ event.guests }}</span></td>
          <td><span class="total">{{ getTotal(event) }}</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
