<app-skeleton *ngIf="loading" type="chart" [height]="260"></app-skeleton>

<!-- Datos -->
<div *ngIf="!loading && !error" class="chart-card">

  <div class="chart-header">
    <div>
      <h3 class="chart-title">Organizadores por plan</h3>
      <p class="chart-sub">Distribución según tipo de plan</p>
    </div>
    <div class="badge-destacado" *ngIf="featuredPlan">
      <i class="ti ti-star"></i>
      {{ featuredPlan }}
    </div>
  </div>

  <div class="chart-wrapper">
    <canvas id="planChart"></canvas>
  </div>

</div>
