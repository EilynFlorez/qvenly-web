<header class="topbar">
  <div class="topbar-left">
    <h1 class="topbar-title">{{ title }}</h1>
    <p class="topbar-sub">{{ subtitle }}</p>
  </div>
  <button class="btn-export" *ngIf="showExport" (click)="openModal()">
    <i class="ti ti-download"></i>
    Exportar
  </button>
</header>

<div class="modal-overlay" *ngIf="showExportModal" (click)="closeModal()">

  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Exportar reporte</h2>
      <button class="modal-close" (click)="closeModal()">
        <i class="ti ti-x"></i>
      </button>
    </div>

     <p class="modal-sub">Selecciona el formato en el que deseas exportar el reporte</p>

    <div class="export-options">

      <!-- EXCEL -->
      <div class="export-card" (click)="exportExcel()">
        <div class="export-icon excel">
          <i class="ti ti-file-spreadsheet"></i>
        </div>
        <p class="export-label">Excel</p>
        <p class="export-desc">Exportar en formato .xlsx</p>
      </div>

      <!-- PDF -->
      <div class="export-card" (click)="exportPdf()">
        <div class="export-icon pdf">
          <i class="ti ti-file-type-pdf"></i>
        </div>
        <p class="export-label">PDF</p>
        <p class="export-desc">Exportar en formato .pdf</p>
      </div>

    </div>

  </div>
</div>
